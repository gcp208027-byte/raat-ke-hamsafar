<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Raat ke Humsafar</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <header>

        <div class="online">

            <span class="dot"></span>

            <span>online</span>

        </div>


        <div class="music-links">

            <a href="#">
                YT Music
            </a>

        </div>

    </header>


    <main>

        <h1>
            
            Raat ke<br>
            Humsafar

            
        </h1>

    </main>


    <div id="youtube-player"></div>

    <!-- Music Player -->

<div class="player">


    <!-- Album -->

    <div class="album">

        <img
            src="images/background.jpg"
            alt="Raat ke Hamsafar"
        >

    </div>


    <!-- Song information -->

    <div class="song-info">

        <div class="song-title">

            Raat Ke Humsafar

        </div>


        <div class="artist">

            YouTube Music

        </div>


        <div class="progress-container">

            <div class="progress"></div>

        </div>


        <div class="time">

            <span id="current-time">
                0:00
            </span>

            <span id="total-time">
                0:00
            </span>

        </div>

    </div>


    <!-- Controls -->

    <div class="controls">

        <button id="previous">
            |◀
        </button>


        <button
            id="play"
            class="play-button">

            ▶

        </button>


        <button id="next">
            ▶|
        </button>

    </div>


</div>

    <script src="script.js"></script>


</body>

</html>
